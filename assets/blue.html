<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>蓝色网页</title>
  <style>
    :root { --page-blue: #1565C0; --page-text: #fff; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--page-blue);
      color: var(--page-text);
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      text-align: center;
    }
    h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 600; }
    p { margin: 0; font-size: 1.125rem; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h1>蓝色网页</h1>
    <p>一片蓝色，片刻宁静。</p>
  </main>
</body>
</html>
